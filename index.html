<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drawing Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101923;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Thanh trên */
        .header {
            height: 60px;
            background: #162b3d;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .header h2 {
            margin: 0;
            margin-right: 30px;
        }

        /* Nút chọn file */
        .upload-btn {
            background: #4da3d9;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .upload-btn:hover {
            background: #65b5e8;
        }

        #fileInput {
            display: none;
        }

        /* Khu vực chính */
        .main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        /* Bên trái */
        .sidebar {
            width: 280px;
            background: #142230;
            border-right: 1px solid #33495c;
            padding: 20px;
        }

        .sidebar h3 {
            margin-top: 0;
        }

        #fileName {
            color: #66c7ff;
            word-break: break-all;
        }

        /* Khu vực PDF */
        .viewer {
            flex: 1;
            background: #303030;
        }

        #pdfViewer {
            width: 100%;
            height: 100%;
            border: none;
        }

        .welcome {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #aaa;
        }

        .welcome h1 {
            color: white;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">

        <h2>📐 DRAWING VIEWER</h2>

        <label class="upload-btn">
            📂 Chọn bản vẽ PDF

            <input
                type="file"
                id="fileInput"
                accept=".pdf"
            >
        </label>

    </div>


    <!-- MAIN -->
    <div class="main">

        <!-- SIDEBAR -->
        <div class="sidebar">

            <h3>Thông tin bản vẽ</h3>

            <p>File đang xem:</p>

            <p id="fileName">
                Chưa chọn bản vẽ
            </p>

        </div>


        <!-- PDF VIEWER -->
        <div class="viewer">

            <div class="welcome" id="welcome">

                <div>

                    <h1>Drawing Viewer</h1>

                    <p>
                        Bấm "Chọn bản vẽ PDF" để mở bản vẽ
                    </p>

                </div>

            </div>


            <iframe
                id="pdfViewer"
                style="display: none;"
            ></iframe>

        </div>

    </div>


    <script>

        const fileInput = document.getElementById("fileInput");

        const pdfViewer = document.getElementById("pdfViewer");

        const welcome = document.getElementById("welcome");

        const fileName = document.getElementById("fileName");


        fileInput.addEventListener("change", function () {

            const file = this.files[0];

            if (!file) {
                return;
            }


            // Kiểm tra PDF
            if (file.type !== "application/pdf") {

                alert("Vui lòng chọn file PDF!");

                return;
            }


            // Hiển thị tên file
            fileName.textContent = file.name;


            // Tạo đường dẫn tạm tới file PDF
            const fileURL = URL.createObjectURL(file);


            // Hiển thị PDF
            pdfViewer.src = fileURL;

            pdfViewer.style.display = "block";

            welcome.style.display = "none";

        });

    </script>

</body>
</html>
