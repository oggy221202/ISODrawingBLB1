<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drawing Viewer</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        header {
            height: 60px;
            background: #0b2a4a;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 25px;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        .sidebar {
            width: 280px;
            background: white;
            padding: 20px;
            border-right: 1px solid #ddd;
        }

        .sidebar h3 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0b2a4a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #17466f;
        }

        #fileInput {
            display: none;
        }

        #fileName {
            margin-top: 15px;
            font-size: 14px;
            word-break: break-word;
            color: #444;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
        }

        .viewer {
            flex: 1;
            background: #ddd;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

<header>
    DRAWING VIEWER
</header>

<div class="container">

    <div class="sidebar">

        <h3>Thông tin bản vẽ</h3>

        <button onclick="document.getElementById('fileInput').click()">
            Chọn bản vẽ PDF
        </button>

        <input
            type="file"
            id="fileInput"
            accept=".pdf"
            onchange="uploadPDF(this.files[0])"
        >

        <div id="fileName">
            Chưa chọn bản vẽ
        </div>

        <div id="status"></div>

    </div>

    <div class="viewer">

        <iframe id="pdfViewer"></iframe>

    </div>

</div>

<script>

    // ==========================================
    // SUPABASE CONFIG
    // ==========================================

    const SUPABASE_URL = "https://thqxkfuvcrklkhasewzi.supabase.co";

    const SUPABASE_KEY = "sb_publishable_wt0QuAO9wkqYLwJFEcIHbQ_0t_FQJ3q";


    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // ==========================================
    // UPLOAD PDF
    // ==========================================

    async function uploadPDF(file) {

        if (!file) {
            return;
        }

        // Chỉ cho phép PDF
        if (file.type !== "application/pdf") {

            alert("Vui lòng chọn file PDF.");

            return;
        }


        const fileName = file.name;

        document.getElementById("fileName").innerText =
            "Đang upload: " + fileName;

        document.getElementById("status").innerText =
            "Đang upload lên Supabase...";


        // Tạo tên file duy nhất
        const filePath =
            Date.now() + "_" + fileName;


        // Upload vào bucket drawings
        const { data, error } = await supabaseClient
            .storage
            .from("drawings")
            .upload(filePath, file, {
                contentType: "application/pdf",
                upsert: false
            });


        // Nếu upload lỗi
        if (error) {

            console.error(error);

            document.getElementById("status").innerText =
                "Upload lỗi: " + error.message;

            return;
        }


        // Lấy URL của file
        const { data: publicURL } =
            supabaseClient
                .storage
                .from("drawings")
                .getPublicUrl(filePath);


        const pdfURL = publicURL.publicUrl;


        console.log("PDF URL:", pdfURL);


        // Hiển thị PDF
        document.getElementById("pdfViewer").src = pdfURL;


        document.getElementById("fileName").innerText =
            fileName;

        document.getElementById("status").innerText =
            "Upload thành công ✓";

    }

</script>

</body>
</html>
